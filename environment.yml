name: SAMOS_311
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core scientific stack
      - numpy>=1.24
      - scipy>=1.10
      - pandas>=2.0
      - scikit-learn>=1.3

      # Multi-objective optimisation
      - pymoo==0.6.1.5
      - pysamoo
      - cma

      # Surrogate models
      - xgboost>=2.0

      # Bayesian optimisation (MO-SMAC)
      - smac>=2.0
      - ConfigSpace

      # NAS benchmarks
      - evoxbench

      # Plotting & analysis
      - matplotlib>=3.7
      - seaborn>=0.13
      - robustranking

      # Utilities
      - tqdm
      - pyyaml
      - joblib
