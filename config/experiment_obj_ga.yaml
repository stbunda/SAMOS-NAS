# Experiment 1: GA comparison under varying objectives
# Consumed by experiment_obj_ga.py (per-run driver) and analyse_obj_ga.py.

# ─── algorithm set (8) ────────────────────────────────────────────────────────
algorithms:
  - {name: random,    label: "Random"}
  - {name: nsga2,     label: "NSGA-II"}
  - {name: nsga3,     label: "NSGA-III"}
  - {name: moead,     label: "MOEA/D"}
  - {name: sms-emoa,  label: "SMS-EMOA"}
  - {name: rvea,      label: "RVEA"}
  - {name: age-moea,  label: "AGE-MOEA"}
  - {name: age-moea2, label: "AGE-MOEA-II"}

# ─── shared budget / protocol ─────────────────────────────────────────────────
seeds: 20
n_gen: 100
pop_size_floor: 12
metric_checkpoints: [10, 20, 50, 100]   # used only by analysis for table extraction
results_root: "results/obj_ga"

# ─── sub-experiments (keyed by n_obj) ─────────────────────────────────────────
# Each block lists the WFG and EvoXBench problems for that objective count.
# wfg / evoxbench problem lists are kept separable so callers can iterate either.
experiments:
  "1.1":
    n_obj: 2
    wfg:
      n_var: 12
      problems: [wfg1, wfg2, wfg3, wfg4, wfg5, wfg6, wfg7, wfg8, wfg9]
    evoxbench:
      c10mop:  [1, 8]
      in1kmop: [1, 4, 7]
  "1.2":
    n_obj: 3
    wfg:
      n_var: 14
      problems: [wfg1, wfg2, wfg3, wfg4, wfg5, wfg6, wfg7, wfg8, wfg9]
    evoxbench:
      c10mop:  [2, 3, 9]
      in1kmop: [3, 6]
  "1.3":
    n_obj: 4
    wfg:
      n_var: 16
      problems: [wfg1, wfg2, wfg3, wfg4, wfg5, wfg6, wfg7, wfg8, wfg9]
    evoxbench:
      c10mop:  [4, 5, 6, 7]
      in1kmop: [9]
